apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
type: Opaque
stringData:
  # String de conexão AMQP do RabbitMQ no cluster ou IP externo
  # Exemplo interno K3s: amqp://videobox:123456@rabbitmq.default.svc.cluster.local:5672/
  host: "amqp://videobox:123456@rabbitmq.default.svc.cluster.local:5672/"
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-trigger-auth
spec:
  secretTargetRef:
    - parameter: host
      name: rabbitmq-secret
      key: host
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: videobox-process
spec:
  # O KEDA gerencia a contagem de réplicas automaticamente
  replicas: 0
  selector:
    matchLabels:
      app: videobox-process
  template:
    metadata:
      labels:
        app: videobox-process
    spec:
      nodeSelector:
        role: processor
      containers:
        - name: process
          image: videobox-process:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBIT_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: host
            - name: EXPORT_PATH
              value: /srv/videobox/export
            - name: CLEAN_TMP
              value: "true"
            - name: REPO_STREAM_URL
              value: http://repository.default.svc.cluster.local:8001
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - mountPath: /srv/videobox/export
              name: export
      volumes:
        - name: export
          persistentVolumeClaim:
            claimName: videobox-export-pvc
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: videobox-process-scaledobject
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: videobox-process
  minReplicaCount: 0          # Escala a 0 (desliga pods) quando não há vídeos para processar
  maxReplicaCount: 10         # Limite máximo de réplicas simultâneas de FFMPEG
  cooldownPeriod: 60          # Tempo (segundos) aguardando antes de reduzir pods após a fila esvaziar
  pollingInterval: 15         # Frequência (segundos) em que o KEDA consulta a fila no RabbitMQ
  triggers:
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: video.uploaded # Fila escutada pelo worker no FastStream
        mode: QueueLength
        value: "1"                # 1 vídeo por pod (como FFMPEG usa muita CPU, 1 por pod garante velocidade máxima)
      authenticationRef:
        name: rabbitmq-trigger-auth
