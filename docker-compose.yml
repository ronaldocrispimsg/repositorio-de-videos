services:
  rabbitmq:
    build: ./rabbitMQ
    container_name: videobox-rabbitmq
    env_file: ./rabbitMQ/.env
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: videobox-backend
    user: "1000:1000"
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/videos_raw:/videos_raw
    depends_on:
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: videobox-frontend
    env_file: ./frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend

  process:
    build: ./process
    container_name: videobox-process
    user: "1000:1000"
    env_file: ./process/.env
    volumes:
      - ./process/export:/srv/videobox/export
    depends_on:
      rabbitmq:
        condition: service_healthy

  repository:
    build: ./repository
    container_name: videobox-repository
    user: "1000:1000"
    env_file: ./repository/.env
    ports:
      - "8001:8001"
    volumes:
      - ./repository/processed_videos:/processed_videos
    networks:
      default:
        aliases:
          - repo_stream
    depends_on:
      - rabbitmq

  gateway:
    build: ./nginx
    container_name: videobox-gateway
    env_file: ./nginx/.env
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
      - rabbitmq
